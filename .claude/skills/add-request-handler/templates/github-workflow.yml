# Klart request handler "__ID__", generated by /add-request-handler.
# Klart's GitHub and Git syncs commit request files to requests/; this runs the matching job and deletes them.
name: Klart requests (__ID__)

on:
  push:
    branches: [__BRANCH__]
    paths: ["requests/*.json"]
  # __SCHEDULE__
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: klart-requests-__ID__
  cancel-in-progress: false

jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: __BRANCH__
          fetch-depth: 0

      # Pushes made with GITHUB_TOKEN don't start workflows, so deleting the files can't loop.
      - name: Handle requests
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          # __ENV__
        run: sh .github/klart/handle-requests-__ID__.sh
