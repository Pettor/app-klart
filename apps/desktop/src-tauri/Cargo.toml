[package]
name = "klart-desktop"
version = "0.4.2"
description = "Klart desktop app"
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (rust-lang/cargo#8519).
name = "klart_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
